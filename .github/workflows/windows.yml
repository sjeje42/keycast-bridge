name: Windows portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser overlay
        run: |
          npm --prefix web ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix web run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix web run build
          exit $LASTEXITCODE
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            python
      - name: Build, test and collect runtime
        shell: msys2 {0}
        run: |
          cargo test --locked --release
          cargo build --locked --release
          /usr/bin/python packaging/windows/bundle.py
          version=$(/usr/bin/python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          printf '%s\n' "KEYCAST_VERSION=$version" >> "$GITHUB_ENV"
          printf '%s\n' "KEYCAST_UCRT_ROOT=$(cygpath -w /ucrt64)" >> "$GITHUB_ENV"
      - name: Launch portable GUI without MSYS2 on PATH
        run: packaging/windows/test-portable.ps1
      - name: HTTP and WebSocket smoke test
        run: |
          $env:KEYCAST_DEMO = Join-Path $PWD 'dist/keycast-bridge-windows-x64/keycast-bridge-demo.exe'
          node scripts/smoke.mjs
          exit $LASTEXITCODE
      - name: Archive and checksum
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYCAST_VERSION)) { throw 'Missing Cargo package version' }
          $archiveName = "keycast-bridge_$($env:KEYCAST_VERSION)_windows-x64.zip"
          $archivePath = Join-Path 'dist' $archiveName
          Compress-Archive -Path dist/keycast-bridge-windows-x64 -DestinationPath $archivePath
          $hash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName" | Set-Content dist/SHA256SUMS-windows.txt -Encoding utf8
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: keycast-bridge-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
