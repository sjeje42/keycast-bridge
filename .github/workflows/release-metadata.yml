name: Release metadata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packaging/RELEASE.md', 'docs/pdf/**', '.github/workflows/release-metadata.yml']
permissions:
  contents: write
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Attach PDF guides and refresh release notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No published release yet; packaging workflow will supply metadata."
            exit 0
          fi
          mkdir -p release-assets
          gh release view "$tag" --json assets --jq '.assets[].name' > /tmp/keycast-release-asset-names.txt
          for pdf in docs/pdf/*.pdf; do
            name=$(basename "$pdf")
            if grep -Fxq "$name" /tmp/keycast-release-asset-names.txt; then
              gh release download "$tag" --pattern "$name" --dir release-assets
              cmp "$pdf" "release-assets/$name" || { echo "Existing PDF differs; refusing to overwrite $name"; exit 1; }
            else
              gh release upload "$tag" "$pdf"
              cp "$pdf" release-assets/
            fi
          done
          gh release download "$tag" --pattern '*.deb' --pattern '*.zip' --dir release-assets
          (cd release-assets && sha256sum *.deb *.zip *.pdf > SHA256SUMS)
          gh release upload "$tag" release-assets/SHA256SUMS --clobber
          gh release edit "$tag" --notes-file packaging/RELEASE.md

