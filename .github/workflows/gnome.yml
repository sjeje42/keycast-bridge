name: GNOME 48 presentation
on:
  push:
    branches: [main, feature/presentation-tools]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gnome:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: GNOME 48 nested Wayland integration on Debian 13
        run: docker run --rm -v "$PWD:/work:ro" -w /work debian:13-slim sh scripts/test-gnome-container.sh
