name: Debian 13 package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: debian-package
  cancel-in-progress: false
jobs:
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and check browser overlay
        run: npm --prefix web ci && npm --prefix web run check && npm --prefix web run build
      - name: Compile and package on Debian 13
        run: docker run --rm -v "$PWD:/work" -w /work debian:13-slim sh packaging/build-in-debian.sh
      - name: Test install, GUI launch, removal and reinstall on clean Debian 13
        run: docker run --rm -v "$PWD:/work:ro" -w /work debian:13-slim sh packaging/test-install.sh
      - name: Checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: keycast-bridge-debian13-amd64
          path: dist/*
          if-no-files-found: error
