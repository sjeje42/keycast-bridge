[package]
name = "keycast-bridge"
version = "0.2.0-alpha.6"
edition = "2021"
license = "GPL-3.0-only"
description = "Local keyboard shortcut overlay for OBS on Linux / Wayland and Windows"
authors = ["Jérôme Stavrianos"]

[features]
default = ["gui"]
gui = ["dep:gtk4"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
gtk4 = { version = "0.9", optional = true, features = ["v4_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"
xkbcommon = "0.8"
udev = "0.9"
nix = { version = "0.29", features = ["socket", "uio", "process", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[[bin]]
name = "keycast-bridge"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[bin]]
name = "keycast-bridge-capture"
path = "src/bin/capture.rs"

[[bin]]
name = "keycast-bridge-demo"
path = "src/bin/demo.rs"

